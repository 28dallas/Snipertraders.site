<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="rangerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2b4" />
      <stop offset="55%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162036" />
      <stop offset="100%" stop-color="#0a0e1a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" stroke="#1e2a40" stroke-width="2"/>

  <!-- Geometric Ranger 'R' + Arrow Shape -->
  <g filter="url(#glow)">
    <!-- Upward Momentum Polygon / Left Leg -->
    <path d="M26 76 V24 H46 C57 24 64 30 64 40 C64 48 58 53 49 55 L66 76 H52 L38 56 H38 V76 Z" fill="url(#rangerGrad)"/>
    <!-- Inner Cutout of R -->
    <path d="M38 34 V46 H46 C50 46 53 43 53 40 C53 36 50 34 46 34 Z" fill="#0d1424"/>
    <!-- High-frequency Pulse Indicator -->
    <circle cx="74" cy="26" r="4.5" fill="#00d2b4" />
    <circle cx="74" cy="26" r="8" stroke="#00d2b4" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6" />
  </g>
</svg>
